<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Table - WebQuiz</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --container-bg: white;
            --text-color: #333;
            --border-color: #ddd;
            --button-bg: #007bff;
            --button-hover: #0056b3;
            --error-bg: #f8d7da;
            --error-border: #f5c6cb;
            --error-color: #721c24;
            --light-bg: #fafafa;
            --row-hover: #e8f4ff;
            --muted-gray: #6c757d;
            --muted-gray-hover: #5a6268;
            --text-muted: #666;
            --white: white;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --border-color: #555;
            --button-bg: #0d6efd;
            --button-hover: #0b5ed7;
            --error-bg: #3a1a1a;
            --error-border: #5a2d2d;
            --error-color: #ef9a9a;
            --light-bg: #333;
            --row-hover: #3a3a3a;
            --muted-gray: #757575;
            --muted-gray-hover: #616161;
            --text-muted: #aaa;
            --white: white;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Inside the file manager pop-up the pop-up already shows the file name */
        body.embedded {
            padding: 0;
            background-color: var(--container-bg);
        }

        body.embedded .page-header {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: 22px;
            overflow-wrap: anywhere;
        }

        .page-header a {
            color: var(--button-bg);
            text-decoration: none;
        }

        .page-header a:hover {
            text-decoration: underline;
        }

        button {
            background: var(--button-bg);
            color: var(--white);
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        button:hover {
            background: var(--button-hover);
        }

        button.secondary {
            background: var(--muted-gray);
        }

        button.secondary:hover {
            background: var(--muted-gray-hover);
        }

        .theme-toggle {
            background: none;
            font-size: 22px;
            padding: 4px 8px;
        }

        .theme-toggle:hover {
            background: var(--light-bg);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 10px 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 260px;
            min-width: 0;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .filter-group select {
            width: 100%;
            max-width: 100%;
            padding: 7px 8px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--container-bg);
            color: var(--text-color);
        }

        .filter-group select.active {
            border-color: var(--button-bg);
            box-shadow: 0 0 0 1px var(--button-bg);
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        #row-count {
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
        }

        .message.error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-color);
        }

        .message a {
            color: inherit;
            font-weight: bold;
        }

        /* The table box scrolls by itself, so the header row and the
           sideways scrollbar stay on screen */
        .csv-table-container {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
        }

        .csv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .csv-table th,
        .csv-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }

        .csv-table th {
            background: var(--button-bg);
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 1;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Long text (questions, answers) wraps instead of making the table very wide.
           pre-line keeps line breaks that are inside the text. */
        .csv-table td {
            white-space: pre-line;
            color: var(--text-color);
        }

        .csv-table tbody tr:nth-child(even) {
            background: var(--light-bg);
        }

        .csv-table tbody tr:hover {
            background: var(--row-hover);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            /* Long file names get their own line under the back link and theme button */
            .page-header h1 {
                order: 3;
                flex-basis: 100%;
                font-size: 18px;
            }

            .theme-toggle {
                margin-left: auto;
            }

            .filter-group {
                flex-basis: 100%;
            }

            .toolbar-actions {
                width: 100%;
            }

            .csv-table th,
            .csv-table td {
                padding: 6px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-header" id="page-header">
        <a href="/files/">← File Manager</a>
        <h1 id="csv-title"></h1>
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light theme">🌙</button>
    </div>

    <div class="toolbar" id="toolbar">
        <div class="filter-group hidden" id="question-filter-group">
            <label for="question-filter">Question</label>
            <select id="question-filter"></select>
        </div>
        <div class="filter-group hidden" id="user-filter-group">
            <label for="user-filter">User</label>
            <select id="user-filter"></select>
        </div>
        <div class="toolbar-actions">
            <span id="row-count"></span>
            <button class="secondary" id="reload-button" title="Read the file again (it grows while the quiz runs)">🔄 Reload</button>
            <button id="open-new-window" class="hidden" title="Open this table with the same filters in a new window">↗ Open in new window</button>
        </div>
    </div>

    <div id="csv-message" class="message hidden"></div>
    <div id="table-container" class="csv-table-container"></div>

    <script>
        // The file name is the last part of the address: /files/csv/{filename}
        const fileName = decodeURIComponent(window.location.pathname.split('/').pop());
        const pageParams = new URLSearchParams(window.location.search);
        const embedded = pageParams.get('embedded') === '1';

        // Parsed file: header row, data rows, and the columns the filters use
        let header = [];
        let dataRows = [];
        let questionColumn = -1;
        let userIdColumn = -1;
        let usernameColumn = -1;
        // user_id -> username, read from the matching users CSV for a plain answers CSV
        let usernamesFromUsersCsv = {};

        // ---------- Theme (shared with the other pages through localStorage) ----------

        function applyTheme() {
            const dark = localStorage.getItem('theme') === 'dark';
            if (dark) {
                document.body.setAttribute('data-theme', 'dark');
            } else {
                document.body.removeAttribute('data-theme');
            }
            document.getElementById('theme-toggle').textContent = dark ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const dark = document.body.getAttribute('data-theme') === 'dark';
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            applyTheme();
        }

        // Follow theme changes made in the file manager or in another window
        window.addEventListener('storage', function(event) {
            if (event.key === 'theme') {
                applyTheme();
            }
        });

        // ---------- CSV reading ----------

        // Reads CSV text the way Python's csv module writes it: fields in quotes
        // may hold commas, doubled quotes and line breaks; lines end with \r\n or \n.
        function parseCSV(text) {
            if (text.charCodeAt(0) === 0xFEFF) {
                text = text.slice(1);  // byte order mark
            }

            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (inQuotes) {
                    if (char === '"' && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        field += char;
                    }
                } else if (char === '"') {
                    inQuotes = true;
                } else if (char === ',') {
                    row.push(field);
                    field = '';
                } else if (char === '\r' || char === '\n') {
                    if (char === '\r' && text[i + 1] === '\n') {
                        i++;
                    }
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += char;
                }
            }

            // The last line may have no line break at the end
            if (field !== '' || row.length > 0) {
                row.push(field);
                rows.push(row);
            }

            // Drop empty lines
            return rows.filter(r => !(r.length === 1 && r[0] === ''));
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ---------- Filters ----------

        function userKey(row) {
            return userIdColumn >= 0 ? row[userIdColumn] : row[usernameColumn];
        }

        function userLabel(row) {
            const userId = userIdColumn >= 0 ? row[userIdColumn] : '';
            let username = usernameColumn >= 0 ? row[usernameColumn] : '';
            if (!username && userId && usernamesFromUsersCsv[userId]) {
                username = usernamesFromUsersCsv[userId];
            }
            if (username && userId) {
                return `${username} (${userId})`;
            }
            return username || userId;
        }

        function compareLabels(a, b) {
            return a.label.localeCompare(b.label, undefined, { numeric: true, sensitivity: 'base' });
        }

        // Fill a <select> with "All ..." plus one option per value; keep the chosen value if it still exists
        function fillSelect(select, allLabel, items, wantedValue) {
            select.innerHTML = '';
            const allOption = document.createElement('option');
            allOption.value = '';
            allOption.textContent = `${allLabel} (${items.length})`;
            select.appendChild(allOption);

            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item.value;
                // Line breaks in a question would be lost in the list anyway; show them as spaces
                option.textContent = item.label.replace(/\s+/g, ' ');
                option.title = item.label;
                select.appendChild(option);
            });

            select.value = items.some(item => item.value === wantedValue) ? wantedValue : '';
        }

        function buildFilters(wantedQuestion, wantedUser) {
            const questionGroup = document.getElementById('question-filter-group');
            const userGroup = document.getElementById('user-filter-group');

            if (questionColumn >= 0) {
                const seen = new Set();
                const questions = [];
                dataRows.forEach(row => {
                    const question = row[questionColumn];
                    if (question !== undefined && question !== '' && !seen.has(question)) {
                        seen.add(question);
                        questions.push({ value: question, label: question });
                    }
                });
                questions.sort(compareLabels);
                fillSelect(document.getElementById('question-filter'), 'All questions', questions, wantedQuestion);
                questionGroup.classList.remove('hidden');
            } else {
                questionGroup.classList.add('hidden');
            }

            if (userIdColumn >= 0 || usernameColumn >= 0) {
                const seen = new Set();
                const users = [];
                dataRows.forEach(row => {
                    const key = userKey(row);
                    if (key !== undefined && key !== '' && !seen.has(key)) {
                        seen.add(key);
                        users.push({ value: key, label: userLabel(row) });
                    }
                });
                users.sort(compareLabels);
                fillSelect(document.getElementById('user-filter'), 'All users', users, wantedUser);
                userGroup.classList.remove('hidden');
            } else {
                userGroup.classList.add('hidden');
            }
        }

        function currentFilters() {
            const questionGroupShown = !document.getElementById('question-filter-group').classList.contains('hidden');
            const userGroupShown = !document.getElementById('user-filter-group').classList.contains('hidden');
            return {
                question: questionGroupShown ? document.getElementById('question-filter').value : '',
                user: userGroupShown ? document.getElementById('user-filter').value : ''
            };
        }

        // Page address with the current filters, e.g. /files/csv/quiz_0001.csv?question=...&user=123456
        function addressWithFilters(includeEmbedded) {
            const filters = currentFilters();
            const params = new URLSearchParams();
            if (includeEmbedded && embedded) params.set('embedded', '1');
            if (filters.question) params.set('question', filters.question);
            if (filters.user) params.set('user', filters.user);
            const query = params.toString();
            return `/files/csv/${encodeURIComponent(fileName)}${query ? '?' + query : ''}`;
        }

        function applyFilters() {
            const filters = currentFilters();
            const visibleRows = dataRows.filter(row => {
                if (filters.question && row[questionColumn] !== filters.question) return false;
                if (filters.user && userKey(row) !== filters.user) return false;
                return true;
            });

            document.getElementById('question-filter').classList.toggle('active', !!filters.question);
            document.getElementById('user-filter').classList.toggle('active', !!filters.user);
            document.getElementById('row-count').textContent =
                `Showing ${visibleRows.length} of ${dataRows.length} rows`;

            renderCsvTable(visibleRows);

            // Keep the filters in the address, so reloading the page keeps them
            history.replaceState(null, '', addressWithFilters(true));
        }

        // ---------- Drawing ----------

        function renderCsvTable(rows) {
            const container = document.getElementById('table-container');

            if (header.length === 0) {
                container.innerHTML = '<div class="empty-state">📊<br>No data to display</div>';
                return;
            }

            let html = '<table class="csv-table"><thead><tr>';
            header.forEach(cell => {
                html += `<th>${escapeHtml(cell)}</th>`;
            });
            html += '</tr></thead><tbody>';

            rows.forEach(row => {
                html += '<tr>';
                for (let i = 0; i < Math.max(header.length, row.length); i++) {
                    html += `<td>${escapeHtml(row[i] === undefined ? '' : row[i])}</td>`;
                }
                html += '</tr>';
            });
            html += '</tbody></table>';

            if (rows.length === 0) {
                html += '<div class="empty-state">No rows match the filters</div>';
            }

            container.innerHTML = html;
        }

        function showMessage(html, isError) {
            const message = document.getElementById('csv-message');
            message.innerHTML = html;
            message.classList.toggle('error', !!isError);
            message.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('csv-message').classList.add('hidden');
        }

        // ---------- Loading ----------

        async function fetchCsv(name) {
            return fetch(`/api/files/csv/view/${encodeURIComponent(name)}`, { credentials: 'same-origin' });
        }

        // A plain answers CSV (quiz_0001.csv) has only user IDs. Its users CSV
        // (quiz_0001.users.csv) has the names, so the user list can show them.
        async function loadUsernames() {
            usernamesFromUsersCsv = {};
            if (usernameColumn >= 0 || userIdColumn < 0) return;
            if (!/\.csv$/i.test(fileName) || /\.users\.csv$/i.test(fileName)) return;

            try {
                const response = await fetchCsv(fileName.replace(/\.csv$/i, '.users.csv'));
                if (!response.ok) return;
                const rows = parseCSV(await response.text());
                if (rows.length < 2) return;
                const idColumn = rows[0].indexOf('user_id');
                const nameColumn = rows[0].indexOf('username');
                if (idColumn < 0 || nameColumn < 0) return;
                rows.slice(1).forEach(row => {
                    if (row[idColumn]) usernamesFromUsersCsv[row[idColumn]] = row[nameColumn] || '';
                });
            } catch (error) {
                // Names are only a convenience; the IDs still work
            }
        }

        async function loadData(wantedQuestion, wantedUser) {
            const container = document.getElementById('table-container');
            container.innerHTML = '<div class="empty-state">Loading...</div>';

            let response;
            try {
                response = await fetchCsv(fileName);
            } catch (error) {
                container.innerHTML = '';
                showMessage(`Could not load the file: ${escapeHtml(error.message)}`, true);
                return;
            }

            if (!response.ok) {
                container.innerHTML = '';
                if (response.status === 401) {
                    showMessage('Please log in on the <a href="/files/">File Manager</a> page first, then reload this page.', true);
                } else {
                    let error = `HTTP ${response.status}`;
                    try {
                        error = (await response.json()).error || error;
                    } catch (e) {
                        // Keep the HTTP status as the error text
                    }
                    showMessage(`Could not load the file: ${escapeHtml(error)}`, true);
                }
                return;
            }

            hideMessage();
            const rows = parseCSV(await response.text());
            header = rows.length > 0 ? rows[0] : [];
            dataRows = rows.slice(1);
            questionColumn = header.indexOf('question');
            userIdColumn = header.indexOf('user_id');
            usernameColumn = header.indexOf('username');

            await loadUsernames();
            buildFilters(wantedQuestion, wantedUser);
            applyFilters();
        }

        function reloadData() {
            const filters = currentFilters();
            loadData(filters.question, filters.user);
        }

        function openInNewWindow() {
            window.open(addressWithFilters(false), '_blank');
        }

        // ---------- Start ----------

        if (embedded) {
            document.body.classList.add('embedded');
            document.getElementById('open-new-window').classList.remove('hidden');
        }
        applyTheme();
        document.getElementById('csv-title').textContent = fileName;
        document.title = `${fileName} - WebQuiz`;

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('reload-button').addEventListener('click', reloadData);
        document.getElementById('open-new-window').addEventListener('click', openInNewWindow);
        document.getElementById('question-filter').addEventListener('change', applyFilters);
        document.getElementById('user-filter').addEventListener('change', applyFilters);

        loadData(pageParams.get('question') || '', pageParams.get('user') || '');
    </script>
</body>
</html>
